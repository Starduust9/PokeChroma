<div class="accueil-scene text-center">
  <div class="hero-scene-content">
    <div class="container">
      <img class="img-fluid d-block mx-auto mt-3" src="/assets/picture/Pok-Chroma-14-04-2025.png" alt="PokéChroma">
    </div>

    <div class="blackO-text text-white response-container" style="max-width: 760px;">
      <h1>Me contacter</h1>
      <p class="pc-intro">Un bug dans le compteur, une faute sur le site, une question ou une idée ?
        Écris-moi, je te réponds dès que possible ✨</p>
      <div class="border-bottom"></div>

      <form id="pc-contact" novalidate>
        <div class="mb-3">
          <label for="SujetInput" class="form-label">Sujet</label>
          <select class="form-control" id="SujetInput" name="sujet">
            <option value="bug">🐞 Signaler un bug du compteur</option>
            <option value="site">✏️ Une erreur sur le site</option>
            <option value="question">❓ Une question</option>
            <option value="idee">💡 Une idée ou une suggestion</option>
            <option value="autre">✉️ Autre</option>
          </select>
        </div>
        <div class="row g-3">
          <div class="col-md-6 mb-3">
            <label for="PseudoInput" class="form-label">Ton pseudo</label>
            <input type="text" class="form-control" id="PseudoInput" name="pseudo" placeholder="Pseudo" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="MailInput" class="form-label">Ton e-mail (pour te répondre)</label>
            <input type="email" class="form-control" id="MailInput" name="email" placeholder="exemple@gmail.com" required>
          </div>
        </div>
        <div class="mb-3" id="ligne-version" style="display: none;">
          <label for="VersionInput" class="form-label">Version du compteur</label>
          <input type="text" class="form-control" id="VersionInput" name="version" placeholder="ex. 1.13.1">
        </div>
        <div class="mb-3">
          <label for="MessageInput" class="form-label">Ton message</label>
          <textarea class="form-control" id="MessageInput" name="message" rows="6" required
                    placeholder="Explique ce qui se passe : ce que tu faisais, ce qui s'est affiché…"></textarea>
        </div>
        <!-- piège à robots : invisible pour les humains -->
        <input type="checkbox" name="botcheck" style="display: none;" tabindex="-1" autocomplete="off">
        <div class="mb-1">
          <button type="submit" class="btn btn-primary" id="btn-envoie-message">Envoyer mon message</button>
        </div>
        <p id="pc-etat" class="pc-intro" style="min-height: 24px;"></p>
      </form>
    </div>
  </div>
</div>
